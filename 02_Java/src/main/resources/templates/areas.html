<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Areas · EcoTrack</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="fragments :: nav"></div><main><header><div><p class="eyebrow">MASTER DATA</p><h1>Residential areas</h1><p class="muted">Maintain service zones and population details.</p></div></header>
<p class="notice" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<div class="grid"><section class="panel"><h2>Add an area</h2><form method="post" action="/areas" th:object="${area}"><label>Area name<input th:field="*{areaName}" placeholder="e.g. Perundurai" required></label><label>Location<input th:field="*{location}" placeholder="Town / ward" required></label><label>Population<input type="number" min="1" th:field="*{population}" required></label><button class="button">Save area</button></form></section>
<section class="panel"><h2>Registered areas</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Population</th><th></th></tr></thead><tbody><tr th:each="a : ${areas}"><td th:text="${a.id}"></td><td th:text="${a.areaName}"></td><td th:text="${a.location}"></td><td th:text="${a.population}"></td><td><form th:action="@{/areas/{id}/delete(id=${a.id})}" method="post"><button class="link danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(areas)}"><td colspan="5" class="empty">No areas added yet.</td></tr></tbody></table></div></section></div></main><footer>EcoTrack</footer></body></html>
