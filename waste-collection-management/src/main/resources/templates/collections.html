<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections Â· EcoTrack</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><header><div><p class="eyebrow">DAILY OPERATIONS</p><h1>Collection activities</h1><p class="muted">Record waste quantities and update the service status.</p></div></header><p class="notice" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<section class="panel"><h2>Record a collection</h2><form method="post" action="/collections" th:object="${collection}" class="formgrid"><label>Collection date<input type="date" th:field="*{collectionDate}" required></label><label>Residential area<select th:field="*{area.id}" required><option value="">Select area</option><option th:each="a : ${areas}" th:value="${a.id}" th:text="${a.areaName}"></option></select></label><label>Vehicle<select th:field="*{vehicle.id}" required><option value="">Select vehicle</option><option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.registrationNumber + ' Â· ' + v.capacityTonnes + ' t'}"></option></select></label><label>Waste category<select th:field="*{wasteCategory}"><option value="Biodegradable">Biodegradable</option><option value="Recyclable">Recyclable</option><option value="Non-recyclable">Non-recyclable</option></select></label><label>Quantity (kg)<input type="number" min="0.01" step="0.01" th:field="*{quantityKg}" required></label><label>Status<select th:field="*{status}"><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></label><label class="wide">Notes<input th:field="*{notes}" placeholder="Optional notes"></label><div><button class="button">Save collection</button></div></form><p class="muted small">Quantity is validated against the selected vehicle's capacity.</p></section>
<section class="panel"><h2>Collection register</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Area</th><th>Vehicle</th><th>Category</th><th>Quantity</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="w : ${collections}"><td th:text="${w.collectionDate}"></td><td th:text="${w.area.areaName}"></td><td th:text="${w.vehicle.registrationNumber}"></td><td th:text="${w.wasteCategory}"></td><td th:text="${w.quantityKg} + ' kg'"></td><td><form th:action="@{/collections/{id}/status(id=${w.id})}" method="post" class="inline"><select name="status"><option th:each="s : ${ {'Pending','In Progress','Completed'} }" th:value="${s}" th:text="${s}" th:selected="${s == w.status}"></option></select><button class="link">Update</button></form></td><td><form th:action="@{/collections/{id}/delete(id=${w.id})}" method="post"><button class="link danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(collections)}"><td colspan="7" class="empty">No collection records yet.</td></tr></tbody></table></div></section></main><footer>EcoTrack</footer></body></html>
